<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Sumo 3D</title>
  <link rel="stylesheet" href="global.css">
</head>

<body>
  <div id="title-screen">
  <div class="lp-bg"></div>

  <div class="lp-planet">
    <svg viewBox="0 0 200 200">
      <polygon points="100,10 150,40 180,100 150,160 100,190 50,160 20,100 50,40"
        fill="#c9b6ff"/>
      <polygon points="100,30 130,50 150,100 130,150 100,170 70,150 50,100 70,50"
        fill="#b0a4e0"/>
    </svg>
  </div>

  <div class="lp-stars"></div>

  <div class="lp-title-wrapper">
    <h1 class="lp-title">SPACE SUMO</h1>
    <p class="lp-sub">A cosmic knockout</p>
    <button id="play-btn" class="lp-btn">Start</button>
  </div>
</div>
<div id="game-container"></div>

  <script type="module" src="/src/main.ts" defer></script>
</body>



</html>
